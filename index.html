<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sal’s Strawberry Saloon</title>
  <link rel="stylesheet" href="./css/style.css"/>


  <!-- firebase start ****************************************-->
  <!-- Firebase App (core Firebase SDK) is always required & must be listed 1st -->
  <script src="https://www.gstatic.com/firebasejs/8.1.2/firebase-app.js"></script>
  <!-- Add Firebase products that you want to use -->
  <script src="https://www.gstatic.com/firebasejs/8.1.2/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.1.2/firebase-database.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.1.2/firebase-analytics.js"></script>
  <!-- firebase end ******************************************-->
  <script type="module" src="./scripts/firebase/fb_init.mjs"></script>
  <script type="module" src="./scripts/firebase/fb_io.mjs"></script>
  <script type="module" src="./scripts/firebase/fb_login.mjs"></script>
  <script type="module" src="./scripts/core/form.mjs"></script>
  <script type="module" src="./scripts/core/adminData.mjs"></script>
  <script type="module" src="./scripts/core/reviews.mjs"></script>
  <script type="module" src="./scripts/core/security.mjs"></script>


  <script type="module" src="./scripts/core/main.mjs"></script>
</head>
<body>
  <div class="container">
    <h1>Sal’s Strawberry Saloon</h1>
    <h2>(and other fruit products)</h2>

    <div id="delete_on_submit">
      <div class="container" style="margin: 0px; padding: 0px;">
        <button onclick="login()">Login with Google</button>

        <img width="40px" height="40px" style="float: right; margin:0px; border-radius: 20px; display:none" src="" id="profile">

      </div>
      
      <form id="fruitForm">
        <label for="name">Your Name:</label>
        <input type="text" id="name" name="name" required />

        <label for="favouriteFruit">Favorite Fruit:</label>
        <input type="text" id="favouriteFruit" name="favouriteFruit" required />

        <label for="fruitQuantity">How many servings per week?</label>
        <input type="number" id="fruitQuantity" name="fruitQuantity" required />

        <!-- add more fields here -->
      </form>

      <button onclick="submitF()">Submit</button>

      <p id="statusMessage"></p>
    </div>
    <div id="thanks_for_answering">
      <h3>Thanks for answering!</h3>

      <div class="container">
        <h4 id="recipient"></h4>
        <p>This is a marketing email. I don't know what to put here, but you know it works.</p>
        <p><i>Buy my strawberries. Now.</i></p>
      </div>
      
      <label for="review">Please leave a review:</label>
      <input id="review" name="review">
      <button onclick="submitR()">Submit</button>
    </div>
    
    <div id="reviews" class="container"></div>
    

    <div class="container" id="show_to_admin" style="display: none;">
      <h3>Top 5 favourite fruits:</h3>
      <p id="fav_fruits_list"></p>
      
    </div>
  </div>
  
</body>
</html>
